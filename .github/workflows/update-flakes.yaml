# .github/workflows/update-flakes.yaml
name: Update Flakes

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: update-flakes
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  get-flake-inputs:
    runs-on: ubuntu-latest
    outputs:
      flake-inputs: ${{ steps.get-flake-inputs.outputs.flake-inputs }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: flake.lock

      - name: Extract flake inputs
        id: get-flake-inputs
        run: |
          flake_inputs="$(jq -c '.nodes.root.inputs | {flake: keys}' flake.lock)"
          echo "flake-inputs=${flake_inputs}" >> "$GITHUB_OUTPUT"

  update-flake:
    name: update-${{ matrix.flake }}
    runs-on: ubuntu-latest
    needs: get-flake-inputs
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.get-flake-inputs.outputs.flake-inputs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v20
        with:
          extra-conf: accept-flake-config = true

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update input with flake-update-action
        id: update-flake
        uses: cpcloud/flake-update-action@v2.0.1
        with:
          dependency: ${{ matrix.flake }}
          github-token: ${{ secrets.GH_TOKEN }}
          pull-request-token: ${{ secrets.GH_TOKEN }}
          pull-request-author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          pull-request-branch-prefix: update-
          automerge: true
          delete-branch: true

      # The upstream action only enables auto-merge when a PR is first created.
      - name: Enable auto-merge for existing update PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATE_BRANCH: update-${{ matrix.flake }}
        run: |
          pr=$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --auto --rebase
          fi
